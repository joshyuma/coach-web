<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Coach" />
  <title>Coach Übungen</title>
  <meta name="theme-color" content="#ec6f1f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png" />
  <style>
    :root{
      /* OKLCH tinted neutrals — warm side */
      --bg:        oklch(0.985 0.006 70);
      --surface:   oklch(1 0 0);
      --surface-2: oklch(0.975 0.008 70);
      --ink:       oklch(0.22 0.02 55);
      --ink-2:     oklch(0.46 0.02 55);
      --ink-3:     oklch(0.62 0.015 60);
      --line:      oklch(0.92 0.012 70);
      --line-2:    oklch(0.88 0.015 65);

      --accent:        oklch(0.68 0.17 47);
      --accent-press:  oklch(0.60 0.18 45);
      --accent-soft:   oklch(0.96 0.04 65);
      --accent-ink:    oklch(0.42 0.14 45);

      --danger:        oklch(0.58 0.18 28);
      --danger-soft:   oklch(0.96 0.03 28);

      /* spacing scale */
      --s-1: 4px;
      --s-2: 8px;
      --s-3: 12px;
      --s-4: 16px;
      --s-5: 24px;
      --s-6: 32px;
      --s-7: 48px;

      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 14px;
      --r-xl: 20px;

      --font-display: "Inter", ui-sans-serif, -apple-system, system-ui, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    body{
      margin:0;
      font-family: var(--font-display);
      font-feature-settings: "ss01", "cv11";
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior-y: none;
    }
    input, textarea{
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
      font-size: 16px; /* prevents iOS Safari auto-zoom on focus */
    }
    img{ -webkit-user-drag: none; user-drag: none; pointer-events: auto; }

    ::selection{ background: var(--accent-soft); color: var(--ink); }

    /* Layout */
    .app{
      max-width: 1080px;
      margin: 0 auto;
      padding: env(safe-area-inset-top) var(--s-4) calc(var(--s-4) + env(safe-area-inset-bottom));
      min-height: 100%;
      display:flex;
      flex-direction:column;
      gap: var(--s-5);
    }

    /* Top bar — quiet, no chrome */
    header{
      position: sticky;
      top: 0;
      z-index: 20;
      padding: var(--s-4) 0 var(--s-3);
      background:
        linear-gradient(to bottom, var(--bg) 70%, transparent);
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: var(--s-3);
    }
    .brand{
      display:flex;
      align-items:center;
      gap: var(--s-3);
      min-width:0;
    }
    .mark{
      width: 32px;
      height: 32px;
      border-radius: 8px;
      flex: 0 0 auto;
      display: block;
    }
    .titlewrap{min-width:0; display:flex; align-items:baseline; gap: var(--s-2); flex-wrap:wrap;}
    .title{
      margin:0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.022em;
      color: var(--ink);
    }
    .subtitle{
      margin:0;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* Buttons */
    .btn{
      appearance:none;
      border: 1px solid var(--line-2);
      background: var(--surface);
      color: var(--ink);
      padding: 9px 14px;
      border-radius: var(--r-md);
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.01em;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      transition: background 140ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 140ms cubic-bezier(0.22, 1, 0.36, 1),
                  color 140ms cubic-bezier(0.22, 1, 0.36, 1),
                  transform 80ms ease-out;
    }
    .btn:hover{ border-color: var(--ink-3); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }
    .btn.primary:hover{ background: var(--accent-press); border-color: var(--accent-press); }
    .btn.accent{
      background: var(--accent);
      border-color: var(--accent);
      color: oklch(0.99 0 0);
    }
    .btn.accent:hover{ background: var(--accent-press); border-color: var(--accent-press); }
    .btn.ghost{
      background: transparent;
      border-color: var(--line);
      color: var(--ink-2);
    }
    .btn.ghost:hover{ color: var(--ink); border-color: var(--ink-3); }
    .btn.danger{
      background: transparent;
      border-color: var(--line-2);
      color: var(--danger);
    }
    .btn.danger:hover{ border-color: var(--danger); }

    /* Content */
    main{
      flex:1;
      display:flex;
      flex-direction:column;
      gap: var(--s-5);
      padding-bottom: 96px;
    }

    /* Section header — typographic, not boxed */
    .section{
      display:flex;
      flex-direction:column;
      gap: var(--s-3);
    }
    .sectionHead{
      display:flex;
      align-items: baseline;
      justify-content:space-between;
      gap: var(--s-3);
      padding: 0 var(--s-1);
    }
    .sectionHead h2{
      margin:0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .sectionHead .meta{
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--ink-3);
    }
    .sectionHead .meta strong{
      color: var(--ink);
      font-weight: 600;
    }
    .sectionHead .actions{ display:flex; gap: var(--s-2); }

    /* Search field — full width, generous, single hairline */
    .field{
      display:flex;
      align-items:center;
      gap: var(--s-3);
      padding: var(--s-3) var(--s-4);
      border-radius: var(--r-md);
      background: var(--surface);
      border: 1px solid var(--line);
      transition: border-color 140ms ease-out, background 140ms ease-out;
    }
    .field:focus-within{
      border-color: var(--ink);
      background: var(--surface);
    }
    .field .k{
      font-family: var(--font-mono);
      color: var(--ink-3);
      font-size: 14px;
      flex: 0 0 auto;
    }
    .field input{
      width:100%;
      border:0; outline:none;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 16px;
      letter-spacing: -0.01em;
    }
    .field input::placeholder{ color: var(--ink-3); }

    /* Category chips — text-led, single hairline */
    .chips{
      display:flex;
      flex-wrap:wrap;
      gap: var(--s-2);
    }
    .chip{
      display:inline-flex; align-items:center;
      padding: 6px 12px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      color: var(--ink-2);
      transition: background 140ms ease-out, border-color 140ms ease-out, color 140ms ease-out;
    }
    .chip:hover{ color: var(--ink); border-color: var(--ink-3); }
    .chip[data-on="1"]{
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }

    /* Exercise grid */
    .list{
      display:grid;
      grid-template-columns: repeat(2,1fr);
      gap: var(--s-3);
    }
    .card{
      display:flex; flex-direction:column;
      border-radius: var(--r-md);
      background: var(--surface);
      border: 1px solid var(--line);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      overflow:hidden;
      position:relative;
      transition: border-color 140ms ease-out, transform 80ms ease-out;
    }
    .card:hover{ border-color: var(--ink-3); }
    .card:active{ transform: translateY(1px); }

    .thumb{
      width:100%;
      aspect-ratio: 4/3;
      overflow:hidden;
      background: var(--surface-2);
      flex:0 0 auto;
      position:relative;
    }
    .thumb img{
      width:100%; height:100%;
      object-fit: cover;
      display:block;
      transition: transform 380ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card:hover .thumb img{ transform: scale(1.02); }
    .thumb .ph{
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
      position:absolute; inset:0;
      display:grid; place-items:center;
    }

    .meta{
      min-width:0;
      flex:1;
      padding: var(--s-3) var(--s-3) var(--s-3);
      display:flex;
      flex-direction:column;
      gap: var(--s-2);
    }
    .meta .t{
      margin:0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.25;
      color: var(--ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .meta .s{
      display:flex; gap: var(--s-3);
      color: var(--ink-3);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .meta .s span{ display:inline-flex; align-items:center; }

    /* Training editor items — horizontal row with inline actions */
    #trList{
      display:flex;
      flex-direction: column;
      gap: var(--s-2);
    }
    .card[data-idx]{
      flex-direction: row;
      align-items: center;
      gap: var(--s-3);
      padding: var(--s-2) var(--s-3) var(--s-2) var(--s-2);
    }
    .card[data-idx] .thumb{
      width: 64px;
      height: 48px;
      aspect-ratio: auto;
      border-radius: var(--r-sm);
      flex: 0 0 auto;
      overflow: hidden;
    }
    .card[data-idx] .meta{
      flex:1; min-width:0;
      padding: 0;
    }
    .card[data-idx] .meta .t{
      font-size: 14px;
      -webkit-line-clamp: 1;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card[data-idx] .actions{
      display:flex;
      gap: var(--s-1);
      flex: 0 0 auto;
    }
    .card[data-idx] .iconbtn{
      position: static;
      width: 28px; height: 28px;
      background: var(--surface);
      box-shadow: none;
      border: 1px solid var(--line);
      color: var(--ink-2);
    }
    .card[data-idx] .iconbtn:hover{ color: var(--ink); border-color: var(--ink-3); }

    /* Training cards in main list — horizontal row */
    .list--trainings{ grid-template-columns: 1fr; gap: var(--s-2); }
    .card[data-tr]{
      flex-direction: row;
      align-items: center;
      padding: var(--s-4) var(--s-4);
      border-radius: var(--r-md);
    }
    .card[data-tr] .thumb{ display:none; }
    .card[data-tr] .meta{ padding:0; flex:1; min-width:0; }
    .card[data-tr] .meta .t{
      font-size: 15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      -webkit-line-clamp: 1;
      display: block;
    }
    .card[data-tr] .iconbtn{
      position: static;
      align-self: center;
      flex: 0 0 auto;
      margin-left: var(--s-3);
    }

    /* Favorite icon overlay on cards */
    .iconbtn{
      position:absolute;
      top: var(--s-2);
      right: var(--s-2);
      border:none;
      background: oklch(1 0 0 / 0.94);
      backdrop-filter: blur(4px);
      color: var(--ink);
      border-radius: 999px;
      width: 30px; height: 30px;
      display:grid; place-items:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      font-size: 14px;
      box-shadow: 0 1px 3px oklch(0.2 0.02 50 / 0.08);
      transition: color 140ms ease-out;
    }
    .iconbtn:hover{ color: var(--accent); }
    .iconbtn[data-on="1"]{
      background: var(--ink);
      color: var(--accent);
    }

    .pill{
      display:inline-flex; align-items:center;
      padding: 3px 8px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--ink-2);
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .empty{
      padding: var(--s-7) var(--s-5);
      border-radius: var(--r-md);
      border: 1px dashed var(--line-2);
      color: var(--ink-3);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      grid-column: 1 / -1;
    }
    .empty b{ color: var(--ink); font-weight: 600; }

    /* Bottom tab bar — minimal */
    .tabs{
      position: fixed;
      left:0; right:0;
      bottom: 0;
      padding: var(--s-2) var(--s-4) calc(var(--s-2) + env(safe-area-inset-bottom));
      background: oklch(1 0 0 / 0.88);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border-top: 1px solid var(--line);
      z-index: 30;
    }
    .tabRow{
      max-width: 1080px;
      margin: 0 auto;
      display:flex;
    }
    .tab{
      flex:1;
      padding: var(--s-3) var(--s-2);
      text-align:center;
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: none;
      background: transparent;
      color: var(--ink-3);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color:transparent;
      position: relative;
      transition: color 140ms ease-out;
    }
    .tab:hover{ color: var(--ink-2); }
    .tab[data-on="1"]{ color: var(--ink); }
    .tab[data-on="1"]::after{
      content:"";
      position:absolute;
      left: 50%; top: -1px;
      transform: translateX(-50%);
      width: 28px; height: 2px;
      background: var(--accent);
      border-radius: 0 0 2px 2px;
    }

    /* Modal */
    .backdrop{
      position: fixed;
      inset:0;
      background: oklch(0.2 0.02 50 / 0.55);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding: var(--s-3);
      z-index: 60;
      animation: fadeIn 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
    @keyframes slideUp{ from{ transform: translateY(16px); opacity: 0;} to{ transform: none; opacity: 1;} }
    .backdrop[data-open="1"]{display:flex}
    .modal{
      width: min(980px, 100%);
      max-height: 92vh;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: 0 24px 60px oklch(0.2 0.02 50 / 0.18);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      animation: slideUp 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .mHead{
      padding: var(--s-5) var(--s-5) var(--s-4);
      border-bottom: 1px solid var(--line);
      display:flex; align-items:flex-start; justify-content:space-between; gap: var(--s-3);
      background: var(--surface);
    }
    .mHead h3{
      margin:0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.15;
      color: var(--ink);
    }
    .mSub{
      margin: var(--s-2) 0 0;
      display:flex;
      gap: var(--s-2);
      flex-wrap:wrap;
    }
    .mBody{
      padding: var(--s-4) var(--s-5) var(--s-5);
      overflow:auto;
    }
    .mRow{
      display:flex;
      gap: var(--s-2);
      flex-wrap:wrap;
    }
    .close{
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-2);
      border-radius: var(--r-sm);
      width: 32px; height: 32px;
      display:grid; place-items:center;
      cursor:pointer;
      font-family: inherit;
      font-weight: 500;
      font-size: 14px;
      flex: 0 0 auto;
      transition: color 140ms ease-out, border-color 140ms ease-out;
    }
    .close:hover{ color: var(--ink); border-color: var(--ink-3); }

    .split{
      display:grid;
      grid-template-columns:1fr;
      gap: var(--s-4);
      margin-top: var(--s-4);
    }
    .preview{
      border-radius: var(--r-md);
      overflow:hidden;
      border: 1px solid var(--line);
      background: var(--surface-2);
    }
    .preview img{
      width:100%;
      height:auto;
      display:block;
      border-bottom: 1px solid var(--line);
    }
    .preview img:last-child{ border-bottom: 0; }

    .label{
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: var(--s-2);
      display:block;
    }
    textarea{
      width:100%;
      min-height: 120px;
      border-radius: var(--r-md);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: var(--s-3) var(--s-4);
      outline:none;
      resize: vertical;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: -0.01em;
      transition: border-color 140ms ease-out;
    }
    textarea:focus{ border-color: var(--ink); }
    textarea::placeholder{ color: var(--ink-3); }

    .note{
      padding: var(--s-3) var(--s-4);
      border-radius: var(--r-md);
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink-2);
      font-size: 13px;
      line-height: 1.5;
    }
    .note b, .note code{ color: var(--ink); }
    .err{
      margin-top: var(--s-3);
      padding: var(--s-3) var(--s-4);
      border-radius: var(--r-md);
      border: 1px solid var(--danger);
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 13px;
      line-height: 1.5;
      display:none;
    }

    /* Desktop */
    @media (min-width: 640px){
      .list{ grid-template-columns: repeat(3,1fr); }
    }
    @media (min-width: 860px){
      .split{ grid-template-columns: 1.2fr 1fr; }
      .list{ grid-template-columns: repeat(4,1fr); }
      main{ padding-bottom: 110px; }
    }
    @media (min-width: 1100px){
      .list{ grid-template-columns: repeat(5,1fr); }
    }

    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    code{
      font-family: var(--font-mono);
      font-size: 0.92em;
      background: var(--surface-2);
      border: 1px solid var(--line);
      padding: 1px 6px;
      border-radius: 4px;
    }
  </style>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>
  <div class="app">
    <header>
      <div class="topbar">
        <div class="brand">
          <img class="mark" src="assets/icon.svg" alt="" aria-hidden="true" />
          <div class="titlewrap">
            <p class="title">Coach Übungen</p>
            <p class="subtitle" id="subline">Drill Library</p>
          </div>
        </div>
        <button class="btn accent" id="btnNewTraining">Neues Training</button>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="sectionHead">
          <h2 id="leftTitle">Filter</h2>
          <p class="meta"><strong id="hitCount">0</strong> Treffer</p>
        </div>
        <div class="field">
          <span class="k">⌕</span>
          <input id="search" type="text" placeholder="Übung suchen: 1-on-1, Pick-and-Roll, Closeout …" autocomplete="off" />
        </div>
        <div class="chips" id="chips"></div>
      </section>

      <section class="section">
        <div class="sectionHead">
          <h2 id="rightTitle">Übungen</h2>

let __lastTouchEnd = 0;

  const now = Date.now();
  if (now - __lastTouchEnd < 350) e.preventDefault();
  __lastTouchEnd = now;

/* =========================
   OCR ADDON
========================= */
const OCR = {
  enabled: true,
  lang: "eng",
  cachePrefix: "coach_ocr_v2:",
  concurrency: 2,
};

function ocrKey(url){ return OCR.cachePrefix + url; }

function ocrGet(url){
  try{ return localStorage.getItem(ocrKey(url)); }catch(e){ return null; }
}

function ocrSet(url, txt){
  try{ localStorage.setItem(ocrKey(url), txt); }catch(e){}
}

async function ocrImage(url){
  const cached = ocrGet(url);
  if(cached !== null) return cached;

  const r = await Tesseract.recognize(url, OCR.lang);

  let text = (r?.data?.text || "")
    

  ocrSet(url, text);
  return text;
}

async function buildOcrIndex(exercises){
  let i = 0;
  const workers = Math.max(1, OCR.concurrency|0);

  async function worker(){
    while(i < exercises.length){
      const ex = exercises[i++];
      const img = ex?.screenshots?.[0];
      if(!img){ ex.ocrText=""; continue; }

      try{ ex.ocrText = await ocrImage(img); }
      catch{ ex.ocrText = ""; }
    }
  }

  await Promise.all(Array.from({length: workers}, ()=>worker()));
}

// Normalisiert Titel (damit kleine Schreibfehler/Bindestriche nicht alles killen)
function keyFromTitle(s){
  return (s||"")
    .toLowerCase()
    .replace(/[’‘]/g,"'")          // typographisches Apostroph
    .replace(/[^a-z0-9]+/g," ")    // alles zu Wörtern
    .trim()
    .replace(/\s+/g," ");
}

// Map: normalisierter Titel -> Kategorie
const TITLE_TO_CATEGORY = (() => {
  const m = Object.create(null);
  for(const [cat, titles] of Object.entries(CATEGORY_TITLES)){
    for(const t of titles){
      m[keyFromTitle(t)] = cat;
    }
  }
  return m;
})();

function categoryFromContentsTitle(exTitle){

  const k = keyFromTitle(exTitle);

  // 1. EXAKTE Inhaltsverzeichnis-Zuordnung
  if(TITLE_TO_CATEGORY[k]) return TITLE_TO_CATEGORY[k];

  // 2. FALLBACK KEYWORDS (gegen Tippfehler)
// extra normalize: "3on3" -> "3 on 3", "1on1" -> "1 on 1"
const s = k.replace(/\b([0-9])on([0-9])\b/g, "$1 on $2");
  // Closeouts
  if(/closeout|close outs|multi skip|multiskip|bounce closeout|bounce closeouts|blast|pickup|pick up|conegate|blind close out|skip and hi|cone gate/.test(s))
    return "CLOSEOUTS";

  // Finishing
  if(/finish|finishes|blind cut|1 on 1 surprise hand off|four spots|rim|chase|perceptual|poster|posters|guided series|1 on 1 hi|touchdown/.test(s))
    return "FINISHING";

  // Shooting
  if(/shoot|shooting|figure|drift|lift|1 on 1 shot tag|exit footwork/.test(s))
    return "SHOOTING";

  // Dribbling
  if(/dribble|dribbling|team knock out|grid|rooted|skate|skates|hostage|hip turn|spanish|sumo|through the gate|change of speed/.test(s))
    return "DRIBBLING";

  // Defense
  if(/defen|7 seconds|defense|protect the rim|mirror game|seven seconds|chest blows|close the gate|lane turns|protect the paint|open and chase/.test(s))
    return "DEFENSE";

  // Passing
  if(/pass|passing|1 on 1 tennis|rapid fire|pivot surprise|rondo|keep away|handball|four sports|4 sports|take two passing/.test(s))
    return "PASSING";

  // Post
  if(/t post|t\-post|deep hooks|deep seals|quick ups|post reactions|post surprise/.test(s))
    return "POST";

  // Rebounding
  if(/rebound|rebounding|hot potato|weak side/.test(s))
    return "REBOUNDING";

  // Player Dev Mix
  if(/aces|exit passes|1 on 2 find a space|gap positioning|retreat|two ball|2 on 1 twist vs under|2 ball|get flashes|get open|find space/.test(s))
    return "PLAYER DEV MIX ACTIVITIES";

  // Pick and Roll (PNR + switch/under usw)
  if(/pick and roll|pick\-and\-roll|pnr|twist vs under|twist versus under|under\b|avoid the pick|cancel the pick|australia|call the coverage|gentleman|hi lo|high\-low|stack pick and roll|what weapon|scram switch|swing to random/.test(s))
    return "PICK AND ROLL";

  // Team Dev Mix (ADV / Advantage usw)
  if(/neutral or advantage|neutral or advantageous|advantage|adv\b|3 stages|three stages|4 on 5|6 on 5|zone|ppp scoring|scramble|fortnite|battleship|cambio|team scoring system|surprise game|floor is lava/.test(s))
    return "TEAM DEV MIX ACTIVITIES";

  // Transition
  if(/transition|breakout and baseball|5 on 5 wheel start|train transition|leak out|outlet|rugby|line touch|two side x out|two\-side x\-out/.test(s))
    return "TRANSITION";

  // Triggers (Coach Tag gehört bei dir zu Dominoes, nicht zu Triggers)
  if(/cross screen|down screen|touch action/.test(s))
    return "TRIGGERS";

  // Dominoes Reactions (Coach Tag, Bursts, Criss-Cross, Domino Drills)
  if(/domino|reaction|coach tag|coach touch|criss cross|criss\-cross|two side coach tag|two\-side coach tag|burst|bursts|tursts|wave|wheel skip|lateral stack|post pen|post\-pen|2 on 2 weave|zero seconds/.test(s))
    return "DOMINOES REACTIONS";

  // Warm-ups & Energizers
  if(/warm|energ|stance games|tennis ball drops|tic tac toe|rock paper scissors|capture the flag|circle tag|cone reaction|pylon exchanges|sheep and wolf|bing bang bong/.test(s))
    return "WARM-UPS & ENERGIZERS";

    // Shooting
  if( /arival spacing|bob sets|court terminology|delay|dominoes|double|gets|hc sets|off ball screens|pick and roll coverage solution|pick and roll spacing|pistol|post reaction|scrabe|shot spectrum|sob sets|solos and single double tripple gaps|stagger|transition|triggers|zoom"/.test(s))
    return "CONCEPTUAL PLAYBOOK";

  return null;

  if(/closeout|blast|pickup/.test(s)) return "CLOSEOUTS";
  if(/finish|rim|paint|chase/.test(s)) return "FINISHING";
  if(/shoot|figure/.test(s)) return "SHOOTING";
  if(/dribble|grid|skate|hostage/.test(s)) return "DRIBBLING";
  if(/pass|tennis|rapid/.test(s)) return "PASSING";
  if(/defen|protect|mirror/.test(s)) return "DEFENSE";
  if(/rebound/.test(s)) return "REBOUNDING";
  if(/post/.test(s)) return "POST";
  if(/trigger/.test(s)) return "TRIGGERS";
  if(/transition|wheel/.test(s)) return "TRANSITION";
  if(/pick|roll|switch/.test(s)) return "PICK AND ROLL";
  if(/domino|reaction|burst/.test(s)) return "DOMINOES REACTIONS";
  if(/warm|energ|stance|tennis ball/.test(s)) return "WARM-UPS & ENERGIZERS";
  if(/team/.test(s)) return "TEAM DEV MIX ACTIVITIES";

  return null;
}

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }

function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function escapeHTML(s){
  return (s+"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function norm(s){
  return (s||"")
    .toLowerCase()
    .replaceAll("’","'") // OCR apostroph
    .replaceAll("ä","ae").replaceAll("ö","oe").replaceAll("ü","ue").replaceAll("ß","ss")
    // Bindestriche/Unterstriche als Worttrenner behandeln
    .replace(/[-_]+/g, " ")
    // alles andere auch zu Spaces
    .replace(/[^a-z0-9]+/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function tokenize(q){
  const n = norm(q);
  return n ? n.split(/\s+/).filter(Boolean) : [];
}

function titleFromBase(base){
  // base like "1-on-1-plus-1-deep-seals" -> pretty title
  let t = base.replace(/\.png$/i,"");
  t = t.replace(/-([0-9]+)$/,""); // remove "-1" suffix (if passed)
  t = t.replaceAll("-", " ");
  // normalize some patterns
  t = t.replace(/\bplus\b/g, "+");
  t = t.replace(/\b(on)\b/g, "on");
  // Title Case-ish
  t = t.split(" ").filter(Boolean).map(w=>{
    if(/^[0-9]+$/.test(w)) return w;
    if(w==="on" || w==="vs") return w;
    if(w==="pnr") return "PNR";
    if(w.length<=2 && w.includes("+")) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(" ");

  // Fix "1 On 1" to "1-on-1"
  t = t.replace(/\b([0-9]+)\sOn\s([0-9]+)\b/g, "$1-on-$2");
  t = t.replace(/\b([0-9]+)\sOn\s([0-9]+)\sOn\s([0-9]+)\b/g, "$1-on-$2-on-$3");
  t = t.replace(/\b([0-9]+)\sOn\s([0-9]+)\sPlus\s([0-9]+)\b/g, "$1-on-$2+$3");
  t = t.replace(/\s+/g," ").trim();
  return t;
}

function baseKeyFromFilename(filename){
  // group multi-image drills like "...-1.png", "...-2.png"
  let f = filename.replace(/^.*\//,""); // strip folder if any
  f = f.replace(/\.png$/i,"");
  f = f.replace(/-[0-9]+$/,""); // remove trailing -1/-2
  return f;
}

function sortByNumberSuffix(a,b){
  // for images within same base: -1, -2, else 0
  const na = (a.match(/-([0-9]+)\.png$/i)?.[1]) ? parseInt(a.match(/-([0-9]+)\.png$/i)[1],10) : 0;
  const nb = (b.match(/-([0-9]+)\.png$/i)?.[1]) ? parseInt(b.match(/-([0-9]+)\.png$/i)[1],10) : 0;
  return na - nb;
}

function nowId() {
  if (crypto?.randomUUID) return crypto.randomUUID();

  // Fallback
  const s4 = () =>
    Math.floor((1 + Math.random()) * 0x10000)
      .toString(16)
      .substring(1);

  return (
    s4() + s4() + "-" +
    s4() + "-" +
    s4() + "-" +
    s4() + "-" +
    s4() + s4() + s4()
  );
}

/* =========================
   Loader (Manifest für GitHub Pages)
   FIX: wir probieren beide Pfade:
        assets/manifest.json UND assets/previews/manifest.json
========================= */
async function fetchJsonTry(url){
  const res = await fetch(url, { cache: "no-cache" });
  if(!res.ok) throw new Error("NOT_OK " + url);
  return await res.json();
}

async function loadManifestFiles(){
  // Priorität: assets/manifest.json, dann assets/previews/manifest.json
  let data;
  try{
    data = await fetchJsonTry("assets/manifest.json");
  }catch{
    data = await fetchJsonTry("assets/previews/manifest.json");
  }
  if(!data || !Array.isArray(data.files)) throw new Error("manifest.json Format falsch");
  return data.files;
}

function parseLinksFromDirectoryHtml(html){
  const files = [];
  const re = /href="([^"]+?\.png)"/gi;
  let m;
  while((m=re.exec(html))!==null){
    let href = m[1];
    if(href.startsWith("?") || href.startsWith("/") || href.includes("..")) continue;
    href = href.split("?")[0];
    files.push(href);
  }
  return Array.from(new Set(files));
}

async function loadFromDirectoryListing(){
  const res = await fetch("assets/previews/", { cache: "no-cache" });
  if(!res.ok) throw new Error("Directory listing nicht erreichbar");
  const html = await res.text();
  return parseLinksFromDirectoryHtml(html);
}

function normalizeFileToUrl(f){
  // f kann sein:
  //  - "abc.png"
  //  - "assets/previews/abc.png"
  //  - "assets/abc.png"
  //  - "previews/abc.png"
  const s = (f||"").trim();
  if(!s) return null;

  if(s.startsWith("assets/")) return s;
  if(s.startsWith("previews/")) return "assets/" + s; // previews/.. -> assets/previews/..
  return "assets/previews/" + s; // nur filename -> previews
}

async function loadAllExercises(){
  let files = [];

  // 1) manifest.json (GitHub Pages)
  try{
    files = await loadManifestFiles();
  }catch(e){
    // 2) directory listing (lokal python server)
    try{
      files = await loadFromDirectoryListing();
    }catch(e2){
      // 3) cached manifest
      const cached = loadJSON(LS.manifestCache, []);
      if(Array.isArray(cached) && cached.length) files = cached;
      else files = [];
    }
  }

  if(files.length) saveJSON(LS.manifestCache, files);

  const resolved = files
    .filter(x => typeof x === "string")
    .map(x => x.trim())
    .filter(Boolean)
    .map(normalizeFileToUrl)
    .filter(Boolean);

  // group by base key
  const groups = new Map();
  for(const full of resolved){
    const filename = full.replace(/^.*\//,"");
    if(!filename.toLowerCase().endsWith(".png")) continue;

    const base = baseKeyFromFilename(filename);
    if(!groups.has(base)) groups.set(base, []);
    groups.get(base).push(full);
  }

  // build exercises
  const exercises = [];
  for(const [base, arr] of groups.entries()){
    arr.sort((a,b)=>sortByNumberSuffix(a.replace(/^.*\//,""), b.replace(/^.*\//,"")));
    const id = base;
    const title = titleFromBase(base);

    // KATEGORIE: aus Inhaltsverzeichnis (deine Liste)
    const mapped = categoryFromContentsTitle(title);

    // Fallback: wenn nichts gefunden wurde, bleibt "unsorted" (aber du willst am Ende alles in der Liste haben)
    const category = mapped || "unsorted";

    exercises.push({ id, title, base, category, screenshots: arr, ocrText: "" });
  }

  EXERCISES = exercises;

  // apply local overrides (falls du manuell umsortiert hast)
  applyCategoryOverrides();

  // sort by category, then title
  EXERCISES.sort((a,b)=>{
    const ca = CATEGORIES.indexOf(a.category), cb = CATEGORIES.indexOf(b.category);
    const c = (ca===-1?999:ca) - (cb===-1?999:cb);
    return c !== 0 ? c : a.title.localeCompare(b.title);
  });

  $("subline").textContent = `${EXERCISES.length} Drills`;
}

function matches(ex, tokens){
  const q = norm(searchEl.value || "");
  if(!q) return true;

  const hay = norm([
    ex.title,
    ex.category,
    ex.base,
    ex.ocrText || ""
  ].join(" "));

  // ✅ Wenn mehrere Wörter: als PHRASE suchen (Reihenfolge zählt!)
  if(q.includes(" ")){
    return hay.includes(q);
  }

  // ✅ Wenn nur ein Wort: normale Suche
  return hay.includes(q);
}

  if(tokens.length) base = base.filter(e => matches(e, tokens));

}

function trainingAction(act, idx){
  const tIdx = trainings.findIndex(t=>t.id===currentTrainingId);
  if(tIdx<0) return;
  const tr = trainings[tIdx];
  tr.items = tr.items || [];
  if(act==="rm") tr.items.splice(idx,1);
  if(act==="up" && idx>0){ const tmp=tr.items[idx-1]; tr.items[idx-1]=tr.items[idx]; tr.items[idx]=tmp; }
  if(act==="down" && idx<tr.items.length-1){ const tmp=tr.items[idx+1]; tr.items[idx+1]=tr.items[idx]; tr.items[idx]=tmp; }
  tr.updatedAt = Date.now();
  trainings[tIdx]=tr;
  saveJSON(LS.trainings, trainings);

  $("trMeta").innerHTML = `<span class="pill">${(tr.items||[]).length} Drill${(tr.items||[]).length===1?"":"s"}</span>
    <span class="pill">${escapeHTML(new Date(tr.updatedAt||Date.now()).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}))}</span>`;

  renderTrainingList();
  render();
}

async function ensureJsPdf(){
  if(window.jspdf && window.jspdf.jsPDF) return;

  await new Promise((resolve)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";
    s.onload=resolve; s.onerror=resolve;
    document.head.appendChild(s);
  });
  if(window.jspdf && window.jspdf.jsPDF) return;

  await new Promise((resolve)=>{
    const s=document.createElement("script");
    s.src="assets/libs/jspdf.umd.min.js";
    s.onload=resolve; s.onerror=resolve;
    document.head.appendChild(s);
  });

  if(!(window.jspdf && window.jspdf.jsPDF)){
    throw new Error("jsPDF konnte nicht geladen werden. (Kein Internet + keine assets/libs/jspdf.umd.min.js)");
  }
}

async function fetchAsDataUrl(url){
  const res = await fetch(url, { cache:"no-cache" });
  if(!res.ok) throw new Error("Fehlendes Bild: " + url);
  const blob = await res.blob();
  return await new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

$("trExportPdf").addEventListener("click", async ()=>{
  const tr = trainings.find(t=>t.id===currentTrainingId);
  if(!tr) return;

  try{ await ensureJsPdf(); }catch(e){ alert("PDF Export nicht möglich: " + e.message); return; }
  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({ unit:"mm", format:"a4", compress:true });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 12;
  const maxW = pageW - margin*2;

  let y = margin;

  doc.setFont("helvetica","bold");
  doc.setFontSize(18);
  doc.text(tr.name, margin, y);
  y += 8;

  doc.setFont("helvetica","normal");
  doc.setFontSize(11);
  doc.text("Exportiert: " + new Date().toLocaleString(), margin, y);
  y += 10;

  const items = tr.items || [];

  for(let i=0;i<items.length;i++){
    const ex = EXERCISES.find(e=>e.id===items[i].exerciseId);
    if(!ex) continue;

    doc.setFont("helvetica","bold");
    doc.setFontSize(14);
    const heading = `${i+1}. ${ex.title}  (${ex.category})`;
    const headLines = doc.splitTextToSize(heading, maxW);
    const headH = headLines.length * 6 + 2;

    const note = (notesById[ex.id] || "").trim();
    let noteH = 0;
    if(note){
      doc.setFontSize(11);
      const nLinesCalc = doc.splitTextToSize("Notizen: " + note, maxW);
      noteH = nLinesCalc.length * 5 + 3;
    }

    // Starte neue Seite wenn Überschrift + Notizen + Mindestplatz für erstes Bild nicht passen
    const minImageSpace = (ex.screenshots||[]).length > 0 ? 35 : 0;
    if(y + headH + noteH + minImageSpace > pageH - margin){ doc.addPage(); y = margin; }

    doc.setFont("helvetica","bold");
    doc.setFontSize(14);
    doc.text(headLines, margin, y);
    y += headH;

    if(note){
      doc.setFont("helvetica","normal");
      doc.setFontSize(11);
      const nLines = doc.splitTextToSize("Notizen: " + note, maxW);
      doc.text(nLines, margin, y);
      y += noteH;
    }

    const shots = (ex.screenshots||[]).slice();
    shots.sort((a,b)=>sortByNumberSuffix(a.replace(/^.*\//,""), b.replace(/^.*\//,"")));

    for(const shotUrl of shots){
      let dataUrl;
      try{ dataUrl = await fetchAsDataUrl(shotUrl); }
      catch(err){
        doc.setTextColor(200, 60, 80);
        const t = doc.splitTextToSize("Bild fehlt: " + shotUrl, maxW);
        if(y + t.length*5 > pageH - margin){ doc.addPage(); y = margin; }
        doc.text(t, margin, y);
        doc.setTextColor(0,0,0);
        y += t.length*5 + 4;
        continue;
      }

      const dims = await new Promise((resolve)=>{
        const img = new Image();
        img.onload = ()=>resolve({ w: img.naturalWidth, h: img.naturalHeight });
        img.onerror = ()=>resolve({ w: 1200, h: 800 });
        img.src = dataUrl;
      });

      const ratio = dims.h / dims.w;
      const drawH = maxW * ratio;

      if(y + drawH > pageH - margin){
        doc.addPage();
        y = margin;
      }

      const imgType = dataUrl.startsWith("data:image/png") ? "PNG" : "JPEG";
      doc.addImage(dataUrl, imgType, margin, y, maxW, drawH, undefined, "FAST");
      y += drawH + 6;
    }

    if(i < items.length - 1){
      if(y + 6 > pageH - margin){ doc.addPage(); y = margin; }
      doc.setDrawColor(210,210,210);
      doc.line(margin, y, pageW - margin, y);
      y += 8;
    }
  }

  const safe = (tr.name || "Training").replace(/[\/\\?%*:|"<>]/g,"-").trim();
  doc.save(safe + ".pdf");
});
